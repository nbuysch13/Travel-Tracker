<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E3D7">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reisepass">
<meta name="mobile-web-app-capable" content="yes">
<title>Reisepass — Länder-Dex</title>
<style>
:root{
  --paper:#E7E3D7; --paper2:#F3F0E7; --paper3:#FBF9F3;
  --ink:#16323F; --ink-soft:#63737A; --line:#C6BEAB;
  --stamp:#6E3B8E; --stamp-red:#A02C3C; --gold:#94762A; --green:#2E5D4E;
  --display: Copperplate, "Copperplate Gothic Light", "Palatino Linotype", Palatino, "Book Antiqua", serif;
  --body: "Avenir Next", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background-color:var(--paper);
  background-image:
    repeating-linear-gradient(62deg, rgba(46,93,78,.055) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(-62deg, rgba(110,59,142,.05) 0 1px, transparent 1px 10px),
    radial-gradient(circle at 50% -15%, rgba(255,255,255,.75), rgba(255,255,255,0) 65%);
  -webkit-text-size-adjust:100%;
  padding:12px 12px 60px; line-height:1.45;
}
.wrap{max-width:940px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}

/* ---------- Passport header ---------- */
.pass{
  background:var(--paper2); border:1px solid var(--line); border-radius:3px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 18px -12px rgba(22,50,63,.6);
  overflow:hidden; position:relative;
}
.pass::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:
    repeating-radial-gradient(circle at 100% 0, transparent 0 12px, rgba(46,93,78,.09) 12px 13px, transparent 13px 26px);
}
.pass-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px 6px;position:relative}
.pass-title{font-family:var(--display);letter-spacing:.19em;font-size:14px;text-transform:uppercase;line-height:1.25}
.pass-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin-top:3px}
.crest{font-size:22px;opacity:.75;filter:grayscale(.3)}
.pass-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:6px 14px 12px;position:relative}
.fld{min-width:0}
.fld .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .vl{font-family:var(--display);font-size:19px;letter-spacing:.04em;line-height:1.15}
.fld .vl small{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
#nameIn{
  width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);
  font-family:var(--display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:1px 0;
}
#nameIn:focus{outline:none;border-bottom-color:var(--stamp)}
.mrz{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;line-height:1.7;
  background:rgba(255,255,255,.6);border-top:1px dashed var(--line);
  padding:8px 14px;white-space:nowrap;overflow-x:auto;overscroll-behavior-x:contain;color:var(--ink)
}
.mrz div{opacity:.88}
.xpbar{height:4px;background:rgba(22,50,63,.1)}
.xpbar i{display:block;height:100%;background:var(--stamp);transition:width .5s ease}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;margin:14px 0 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{
  background:transparent;border:0;padding:9px 12px;font-family:var(--display);
  font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:2px solid transparent;white-space:nowrap
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp)}

/* ---------- Filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
#search{
  flex:1 1 150px;min-width:130px;background:var(--paper3);border:1px solid var(--line);
  border-radius:2px;padding:8px 10px;font-size:14px
}
#search:focus{outline:2px solid var(--stamp);outline-offset:1px}
.chip{
  background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 10px;
  font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft)
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper2)}

/* ---------- Country grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.card{
  position:relative;text-align:left;background:var(--paper3);border:1px solid var(--line);
  border-radius:2px;padding:10px 10px 9px;min-height:82px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s ease
}
.card:active{transform:scale(.985)}
.card.un{background:transparent;border-style:dashed;opacity:.62}
.card .flag{font-size:19px;line-height:1}
.card .nm{font-family:var(--display);font-size:13px;letter-spacing:.05em;margin-top:5px;padding-right:34px}
.card .meta{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-top:4px}
.tier3 .nm{color:var(--gold)}
.card .mini{
  position:absolute;right:-6px;top:6px;transform:rotate(-13deg);
  border:1.5px solid var(--stamp);border-radius:3px;color:var(--stamp);
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px;opacity:.85;
  filter:url(#inkfx)
}
.card .mini b{display:block;font-size:11px;letter-spacing:.12em;text-align:center}
@keyframes slam{0%{transform:rotate(-13deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-13deg) scale(1);opacity:.85}}
.stamped .mini{animation:slam .32s cubic-bezier(.2,1.5,.4,1) both}

/* ---------- Detail page ---------- */
.sheet{position:fixed;inset:0;background:rgba(22,50,63,.6);z-index:40;overflow-y:auto;padding:10px}
.page{
  max-width:640px;margin:0 auto 30px;background:var(--paper2);
  border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden
}
.page::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:repeating-radial-gradient(circle at 0 100%, transparent 0 14px, rgba(110,59,142,.09) 14px 15px, transparent 15px 30px)
}
.page-hd{display:flex;gap:10px;align-items:flex-start;padding:14px 14px 8px;border-bottom:1px dashed var(--line);position:relative}
.page-hd .flag{font-size:32px;line-height:1}
.page-hd h2{font-family:var(--display);font-size:20px;letter-spacing:.06em;margin:2px 0 2px;font-weight:400}
.page-hd .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
.close{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:22px;line-height:1;padding:4px 8px;color:var(--ink-soft)}
.sec{padding:12px 14px;border-bottom:1px dashed var(--line);position:relative}
.sec h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 9px;font-weight:400}
.visit-row{display:flex;align-items:center;gap:10px}
.bigbtn{
  flex:1;background:var(--ink);color:var(--paper2);border:0;border-radius:2px;padding:11px;
  font-family:var(--display);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase
}
.bigbtn.on{background:transparent;color:var(--ink-soft);border:1px dashed var(--line)}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:7px;line-height:1.4}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.frm label{display:block}
.frm .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink-soft);text-transform:uppercase;display:block;margin-bottom:2px}
.frm input,.frm select,.frm textarea{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:4px 0;font-size:14px;border-radius:0
}
.frm input:focus,.frm select:focus,.frm textarea:focus{outline:none;border-bottom:1px solid var(--stamp)}
.frm .wide{grid-column:1/-1}
.frm textarea{resize:vertical;min-height:48px;border:1px solid var(--line);padding:6px;background:var(--paper3)}
.stars{display:flex;gap:3px}
.stars button{background:none;border:0;font-size:19px;padding:0 1px;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.hl{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dotted rgba(198,190,171,.7)}
.hl:last-child{border-bottom:0}
.hl .box{
  flex:0 0 auto;width:19px;height:19px;border:1.5px solid var(--line);border-radius:2px;
  background:transparent;font-size:12px;line-height:1;color:var(--stamp);display:flex;align-items:center;justify-content:center;margin-top:1px
}
.hl .box.on{border-color:var(--stamp);filter:url(#inkfx)}
.hl .tx{font-size:14px;flex:1}
.hl.done .tx{color:var(--ink)}
.hl:not(.done) .tx{color:var(--ink-soft)}
.hl .del{background:none;border:0;color:var(--ink-soft);font-size:14px;padding:0 2px;opacity:.6}
.addhl{display:flex;gap:6px;margin-top:9px}
.addhl input{flex:1;background:var(--paper3);border:1px solid var(--line);padding:7px;font-size:13.5px;border-radius:2px}
.addhl button,.smallbtn{
  background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)
}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{
  position:relative;aspect-ratio:1/1;border:1px dashed var(--line);border-radius:2px;background:var(--paper3);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;overflow:hidden;padding:0
}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .rm{position:absolute;right:3px;top:3px;background:rgba(243,240,231,.9);border:1px solid var(--line);border-radius:2px;font-size:11px;line-height:1;padding:2px 5px}

/* ---------- Achievements ---------- */
.ach{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:2px;background:var(--paper3);margin-bottom:7px}
.ach.locked{border-style:dashed;background:transparent;opacity:.55}
.ach .ic{font-size:20px;line-height:1;filter:grayscale(1)}
.ach:not(.locked) .ic{filter:none}
.ach .t{font-family:var(--display);font-size:13.5px;letter-spacing:.05em}
.ach .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.ach .pg{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-soft);margin-top:4px}

/* ---------- Stamp book ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.bigstamp{
  position:relative;aspect-ratio:1/1;border:2px solid var(--stamp);border-radius:4px;color:var(--stamp);
  background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px;filter:url(#inkfx);opacity:.86
}
.bigstamp.alt{border-color:var(--stamp-red);color:var(--stamp-red)}
.bigstamp .cc{font-family:var(--mono);font-size:20px;letter-spacing:.16em;font-weight:700}
.bigstamp .nn{font-family:var(--display);font-size:9.5px;letter-spacing:.07em;text-align:center;line-height:1.15}
.bigstamp .dd{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;opacity:.85}
.bigstamp::after{content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:2px;opacity:.5}
.empty{font-size:13.5px;color:var(--ink-soft);padding:16px;border:1px dashed var(--line);border-radius:2px;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--paper3);border:1px solid var(--line);border-radius:2px;padding:9px 10px}
.stat .n{font-family:var(--display);font-size:20px;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.danger{border-color:var(--stamp-red);color:var(--stamp-red)}
.warn{background:#F7E9C9;border:1px solid var(--gold);padding:9px 11px;border-radius:2px;font-size:12.5px;margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper2);
  padding:9px 15px;border-radius:2px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s
}
.toast.on{opacity:1}
@media (max-width:420px){
  .pass-grid{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="inkfx"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<div class="wrap">
  <header class="pass">
    <div class="pass-head">
      <div>
        <div class="pass-title">Reisepass</div>
        <div class="pass-sub">Persönliches Länderverzeichnis</div>
      </div>
      <div class="crest">🛂</div>
    </div>
    <div class="pass-grid">
      <div class="fld" style="grid-column:span 2">
        <span class="lb">Name / Surname</span>
        <input id="nameIn" placeholder="DEIN NAME" autocomplete="off" spellcheck="false">
      </div>
      <div class="fld"><span class="lb">Stufe</span><div class="vl" id="lvlOut">1</div></div>
      <div class="fld"><span class="lb">Länder</span><div class="vl" id="cntOut">0<small>/0</small></div></div>
    </div>
    <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
    <div class="mrz"><div id="mrz1"></div><div id="mrz2"></div></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="dex" aria-selected="true">Dex</button>
    <button role="tab" data-tab="book" aria-selected="false">Stempelbuch</button>
    <button role="tab" data-tab="ach" aria-selected="false">Orden</button>
    <button role="tab" data-tab="data" aria-selected="false">Daten</button>
  </nav>

  <main>
    <section id="tab-dex">
      <div class="filters">
        <input id="search" placeholder="Land suchen…" autocomplete="off">
        <button class="chip" data-f="all" aria-pressed="true">Alle</button>
        <button class="chip" data-f="visited" aria-pressed="false">Besucht</button>
        <button class="chip" data-f="open" aria-pressed="false">Offen</button>
      </div>
      <div class="filters" id="contFilters"></div>
      <div class="grid" id="grid"></div>
      <div class="rowbtns"><button class="smallbtn" id="addCountry">+ Eigenes Land</button></div>
    </section>

    <section id="tab-book" hidden>
      <div class="stats" id="bookStats"></div>
      <div class="book" id="book"></div>
    </section>

    <section id="tab-ach" hidden><div id="achList"></div></section>

    <section id="tab-data" hidden>
      <div id="storeWarn"></div>
      <p class="note">Alles bleibt lokal in diesem Browser. Lade die Datei herunter und öffne sie immer vom selben Gerät und Ort aus, dann findest du deine Einträge wieder. Für Umzüge und Backups: exportieren.</p>
      <div class="rowbtns">
        <button class="smallbtn" id="expBtn">Daten exportieren</button>
        <button class="smallbtn" id="impBtn">Daten importieren</button>
        <button class="smallbtn danger" id="resetBtn">Alles löschen</button>
      </div>
      <input type="file" id="impFile" accept="application/json" hidden>
      <div class="stats" id="dataStats"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="sheetHost"></div>
<script>

/* ====== Speicher ====== */
const KEY="reisepass.v1";
let memOnly=false, state={name:"",custom:[],d:{}};
function load(){
  try{const r=localStorage.getItem(KEY); if(r) state=Object.assign(state,JSON.parse(r));}
  catch(e){memOnly=true;}
}
function save(){
  if(memOnly) return;
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){
    memOnly=true;
    toast("Speicher voll. Exportiere deine Daten und entferne ein paar Fotos.");
  }
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600);
}

/* ====== Ableitungen ====== */
const all=()=>BASE.concat(state.custom||[]);
const byCode=c=>all().find(x=>x.c===c);
const rec=c=>state.d[c]||null;
const visited=()=>all().filter(x=>rec(x.c)&&rec(x.c).v);
function doneCount(c){const r=rec(c);return r&&r.hl?r.hl.length:0;}
function totalHl(){return all().reduce((s,x)=>s+doneCount(x.c),0);}
function contSet(){return new Set(visited().map(x=>x.k));}
function xp(){
  let p=0;
  visited().forEach(x=>{p+=10*(x.t||1)});
  p+=3*totalHl();
  p+=15*achs().filter(a=>a.ok).length;
  return p;
}
function photoCount(){return Object.values(state.d).reduce((s,r)=>s+((r.photos||[]).length),0);}
function modeCount(m){return visited().filter(x=>rec(x.c).mode===m).length;}

/* ====== Rendering ====== */
let tab="dex", filter="all", kfilter="", q="", justStamped=null;

function renderPass(){
  const v=visited().length, tot=all().length, p=xp(), lvl=1+Math.floor(p/80), prog=p%80;
  document.getElementById("lvlOut").textContent=lvl;
  document.getElementById("cntOut").innerHTML=v+"<small>/"+tot+"</small>";
  document.getElementById("xpFill").style.width=(prog/80*100)+"%";
  const nm=(state.name||"Reisende:r").toUpperCase().replace(/[^A-Z0-9ÄÖÜ ]/g,"").replace(/ /g,"<");
  const pad=(s,n)=>(s+"<".repeat(Math.max(0,n-s.length))).slice(0,n);
  document.getElementById("mrz1").textContent=pad("P<DEX"+nm+"<<",44);
  document.getElementById("mrz2").textContent=pad(
    "L"+String(v).padStart(3,"0")+"<<K"+contSet().size+"<<XP"+String(p).padStart(5,"0")+
    "<<ORD"+String(achs().filter(a=>a.ok).length).padStart(2,"0"),44);
}

function renderDex(){
  const g=document.getElementById("grid"); g.innerHTML="";
  const cf=document.getElementById("contFilters");
  if(!cf.dataset.done){
    cf.innerHTML='<button class="chip" data-k="" aria-pressed="true">Weltweit</button>'+
      KONT.map(k=>`<button class="chip" data-k="${k}" aria-pressed="false">${k}</button>`).join("");
    cf.dataset.done=1;
  }
  const list=all().filter(x=>{
    const r=rec(x.c);
    if(filter==="visited"&&!(r&&r.v))return false;
    if(filter==="open"&&(r&&r.v))return false;
    if(kfilter&&x.k!==kfilter)return false;
    if(q&&!(x.n.toLowerCase().includes(q)||x.c.toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>a.n.localeCompare(b.n,"de"));
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Kein Land gefunden. Andere Suche oder Filter probieren.</div>';return;}
  list.forEach(x=>{
    const r=rec(x.c), on=r&&r.v;
    const b=document.createElement("button");
    b.className="card"+(on?"":" un")+(x.t===3?" tier3":"")+(justStamped===x.c?" stamped":"");
    b.dataset.code=x.c;
    const hl=(x.h||[]).length+((r&&r.extra)?r.extra.length:0);
    b.innerHTML=`<div><div class="flag">${x.f}</div><div class="nm">${x.n}</div></div>
      <div class="meta">${on?(doneCount(x.c)+"/"+hl+" Ziele"):(x.t===3?"legendär":x.t===2?"selten":"häufig")}</div>
      ${on?`<div class="mini"><b>${x.c}</b>${(r.first||"").slice(0,4)||"—"}</div>`:""}`;
    g.appendChild(b);
  });
  justStamped=null;
}

function renderBook(){
  const s=document.getElementById("bookStats"), b=document.getElementById("book");
  const v=visited(), days=v.reduce((a,x)=>a+(+rec(x.c).days||0),0);
  const rated=v.filter(x=>rec(x.c).rating);
  const best=rated.sort((a,c)=>rec(c.c).rating-rec(a.c).rating)[0];
  const stat=(n,l)=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  s.innerHTML=stat(v.length,"Länder")+stat(contSet().size+"/6","Kontinente")+stat(totalHl(),"Ziele")+
    stat(Math.max(0,...v.map(x=>+rec(x.c).days||0))||0,"Längste Reise (T)")+
    stat(photoCount(),"Fotos")+stat(best?best.f:"—","Bestbewertet");
  if(!v.length){b.innerHTML='<div class="empty" style="grid-column:1/-1">Noch kein Stempel. Öffne im Dex ein Land und markiere es als besucht.</div>';return;}
  b.innerHTML=v.sort((a,c)=>(rec(a.c).first||"9").localeCompare(rec(c.c).first||"9")).map((x,i)=>{
    const r=rec(x.c);
    const d=r.first?new Date(r.first).toLocaleDateString("de-DE",{month:"2-digit",year:"numeric"}):"– / –";
    return `<button class="bigstamp${i%2?" alt":""}" data-code="${x.c}">
      <div class="cc">${x.c}</div><div class="nn">${x.n}</div><div class="dd">${d}</div></button>`;
  }).join("");
}

function renderAch(){
  document.getElementById("achList").innerHTML=achs().map(a=>`
    <div class="ach${a.ok?"":" locked"}">
      <div class="ic">${a.ic}</div>
      <div><div class="t">${a.t}</div><div class="d">${a.d}</div>
      <div class="pg">${a.ok?"Erhalten":a.cur+" / "+a.need}</div></div>
    </div>`).join("");
}

function renderData(){
  document.getElementById("storeWarn").innerHTML = memOnly
    ? '<div class="warn">Dieser Browser speichert gerade nichts dauerhaft (z.&nbsp;B. in der Vorschau oder im privaten Modus). Lade die Datei herunter und öffne sie direkt, dann bleiben deine Einträge erhalten.</div>' : "";
  const bytes=new Blob([JSON.stringify(state)]).size;
  const stat=(n,l)=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  document.getElementById("dataStats").innerHTML=
    stat(visited().length,"Einträge")+stat(photoCount(),"Fotos")+stat((bytes/1048576).toFixed(2)+" MB","Belegter Platz");
}

function render(){
  renderPass();
  if(tab==="dex")renderDex(); else if(tab==="book")renderBook();
  else if(tab==="ach")renderAch(); else renderData();
}

/* ====== Länderseite ====== */
let openCode=null;
const MODES=["","Flug","Auto","Zug","Bus","Schiff","Fahrrad","zu Fuß"];
function ensure(c){ if(!state.d[c]) state.d[c]={v:0,first:"",visits:1,days:"",mode:"",cities:"",food:"",rating:0,note:"",hl:[],extra:[],photos:[]}; return state.d[c]; }

function openSheet(c){
  openCode=c; const x=byCode(c), r=ensure(c);
  const host=document.getElementById("sheetHost");
  const tier=x.t===3?"legendär":x.t===2?"selten":"häufig";
  const hlAll=(x.h||[]).map(t=>({t,own:0})).concat((r.extra||[]).map(t=>({t,own:1})));
  host.innerHTML=`<div class="sheet" id="sheet"><div class="page">
    <div class="page-hd">
      <div class="flag">${x.f}</div>
      <div><h2>${x.n}</h2><div class="meta">${x.c} · ${x.k} · ${tier}</div></div>
      <button class="close" data-act="close" aria-label="Schließen">✕</button>
    </div>

    <div class="sec">
      <div class="visit-row"><button class="bigbtn${r.v?" on":""}" data-act="toggle">${r.v?"Besucht — Stempel entfernen":"Stempel setzen"}</button></div>
      <div class="hint">Zählt erst mit mindestens einer Übernachtung. Umsteigen am Flughafen zählt nicht.</div>
    </div>

    <div class="sec" ${r.v?"":'style="opacity:.45;pointer-events:none"'}>
      <h3>Reisedaten</h3>
      <div class="frm">
        <label><span class="lb">Erster Besuch</span><input type="date" data-k="first" value="${r.first||""}"></label>
        <label><span class="lb">Anzahl Besuche</span><input type="number" min="1" max="99" data-k="visits" value="${r.visits||1}"></label>
        <label><span class="lb">Längster Aufenthalt (Tage)</span><input type="number" min="0" max="999" data-k="days" value="${r.days||""}"></label>
        <label><span class="lb">Angereist per</span><select data-k="mode">${MODES.map(m=>`<option value="${m}"${r.mode===m?" selected":""}>${m||"—"}</option>`).join("")}</select></label>
        <label class="wide"><span class="lb">Städte / Orte</span><input data-k="cities" value="${(r.cities||"").replace(/"/g,"&quot;")}" placeholder="Kotor, Žabljak, …"></label>
        <label class="wide"><span class="lb">Bestes Essen</span><input data-k="food" value="${(r.food||"").replace(/"/g,"&quot;")}" placeholder="Was du wieder essen würdest"></label>
        <div class="wide"><span class="lb">Bewertung</span>
          <div class="stars">${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${(r.rating||0)>=i?"on":""}" aria-label="${i} von 5">★</button>`).join("")}</div>
        </div>
        <label class="wide"><span class="lb">Erinnerung</span><textarea data-k="note" placeholder="Ein Satz, den du in zehn Jahren lesen willst.">${r.note||""}</textarea></label>
      </div>
    </div>

    <div class="sec" ${r.v?"":'style="opacity:.45;pointer-events:none"'}>
      <h3>Ziele im Land · ${doneCount(c)}/${hlAll.length}</h3>
      ${hlAll.map(o=>{const on=(r.hl||[]).includes(o.t);return `<div class="hl${on?" done":""}">
        <button class="box${on?" on":""}" data-hl="${o.t.replace(/"/g,"&quot;")}">${on?"✓":""}</button>
        <span class="tx">${o.t}</span>
        ${o.own?`<button class="del" data-delhl="${o.t.replace(/"/g,"&quot;")}" aria-label="Entfernen">✕</button>`:""}
      </div>`}).join("")}
      <div class="addhl"><input id="newHl" placeholder="Eigenes Ziel ergänzen" maxlength="60"><button data-act="addhl">Hinzufügen</button></div>
    </div>

    <div class="sec" ${r.v?"":'style="opacity:.45;pointer-events:none"'}>
      <h3>Belege · ${(r.photos||[]).length}/3</h3>
      <div class="photos">
        ${[0,1,2].map(i=>{const p=(r.photos||[])[i];
          return p?`<div class="slot"><img src="${p}" alt=""><button class="rm" data-rm="${i}">✕</button></div>`
                  :`<button class="slot" data-add="${i}">+ Foto</button>`}).join("")}
      </div>
      <div class="hint">Fotos werden beim Einfügen verkleinert und liegen nur auf diesem Gerät.</div>
    </div>

    <div class="sec" style="border:0;text-align:right">
      <button class="smallbtn" data-act="close">Schließen</button>
    </div>
  </div></div>`;
  document.body.style.overflow="hidden";
  bindSheet();
}
function prune(c){
  const r=state.d[c]; if(!r)return;
  const leer=!r.v&&!r.note&&!r.cities&&!r.food&&!r.rating&&!(r.hl||[]).length&&!(r.extra||[]).length&&!(r.photos||[]).length;
  if(leer){delete state.d[c];save();}
}
function closeSheet(){prune(openCode);document.getElementById("sheetHost").innerHTML="";document.body.style.overflow="";openCode=null;render();}

function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=e=>{const img=new Image();
    img.onload=()=>{const M=900,s=Math.min(1,M/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.6));};
    img.onerror=()=>toast("Bild konnte nicht gelesen werden.");
    img.src=e.target.result;};
  fr.readAsDataURL(file);
}

function bindSheet(){
  const sh=document.getElementById("sheet"); if(!sh)return;
  sh.addEventListener("click",e=>{
    if(e.target===sh){closeSheet();return;}
    const b=e.target.closest("button"); if(!b)return;
    const r=ensure(openCode);
    if(b.dataset.act==="close"){closeSheet();return;}
    if(b.dataset.act==="toggle"){
      r.v=r.v?0:1;
      if(r.v&&!r.first)r.first=new Date().toISOString().slice(0,10);
      if(r.v)justStamped=openCode;
      save(); openSheet(openCode); renderPass(); return;
    }
    if(b.dataset.star){r.rating=(+b.dataset.star===r.rating)?0:+b.dataset.star;save();openSheet(openCode);return;}
    if(b.dataset.hl!==undefined){
      const t=b.dataset.hl; r.hl=r.hl||[];
      const i=r.hl.indexOf(t); i>-1?r.hl.splice(i,1):r.hl.push(t);
      save(); openSheet(openCode); renderPass(); return;
    }
    if(b.dataset.delhl!==undefined){
      const t=b.dataset.delhl;
      r.extra=(r.extra||[]).filter(z=>z!==t); r.hl=(r.hl||[]).filter(z=>z!==t);
      save(); openSheet(openCode); return;
    }
    if(b.dataset.act==="addhl"){
      const inp=document.getElementById("newHl"), t=inp.value.trim();
      if(!t){inp.focus();return;}
      r.extra=r.extra||[]; if(!r.extra.includes(t))r.extra.push(t);
      save(); openSheet(openCode); return;
    }
    if(b.dataset.rm!==undefined){
      r.photos.splice(+b.dataset.rm,1); save(); openSheet(openCode); return;
    }
    if(b.dataset.add!==undefined){
      const f=document.createElement("input"); f.type="file"; f.accept="image/*";
      f.onchange=()=>{if(!f.files[0])return;
        shrink(f.files[0],url=>{r.photos=r.photos||[];r.photos.push(url);save();openSheet(openCode);});};
      f.click(); return;
    }
  });
  const onEdit=e=>{
    const k=e.target.dataset.k; if(!k)return;
    ensure(openCode)[k]=e.target.value; save(); renderPass();
  };
  sh.addEventListener("change",onEdit);
  sh.addEventListener("input",onEdit);
}

/* ====== Events ====== */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(z=>z.setAttribute("aria-selected",z===b));
  ["dex","book","ach","data"].forEach(t=>document.getElementById("tab-"+t).hidden=(t!==tab));
  render(); window.scrollTo(0,0);
}));
document.getElementById("grid").addEventListener("click",e=>{
  const c=e.target.closest(".card"); if(c)openSheet(c.dataset.code);
});
document.getElementById("book").addEventListener("click",e=>{
  const c=e.target.closest(".bigstamp"); if(c)openSheet(c.dataset.code);
});
document.getElementById("search").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();renderDex();});
document.querySelectorAll('.filters [data-f]').forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;
  document.querySelectorAll('.filters [data-f]').forEach(z=>z.setAttribute("aria-pressed",z===b));
  renderDex();
}));
document.getElementById("contFilters").addEventListener("click",e=>{
  const b=e.target.closest("[data-k]"); if(!b)return;
  kfilter=b.dataset.k;
  document.querySelectorAll("#contFilters [data-k]").forEach(z=>z.setAttribute("aria-pressed",z===b));
  renderDex();
});
document.getElementById("nameIn").addEventListener("input",e=>{state.name=e.target.value;save();renderPass();});
document.getElementById("addCountry").addEventListener("click",()=>{
  const n=prompt("Name des Landes?"); if(!n)return;
  let c=(prompt("Kürzel, 2–3 Buchstaben?","")||n.slice(0,2)).toUpperCase().slice(0,3);
  if(byCode(c)){toast("Kürzel gibt es schon.");return;}
  const k=prompt("Kontinent? "+KONT.join(" / "),"Europa")||"Europa";
  state.custom.push({c,n,f:"🏳️",k:KONT.includes(k)?k:"Europa",t:2,h:[]});
  save(); renderDex(); openSheet(c);
});
document.getElementById("expBtn").addEventListener("click",()=>{
  const b=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="reisepass-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
});
document.getElementById("impBtn").addEventListener("click",()=>document.getElementById("impFile").click());
document.getElementById("impFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{try{
      const o=JSON.parse(fr.result);
      if(!o||typeof o!=="object"||!o.d)throw 0;
      state=Object.assign({name:"",custom:[],d:{}},o);
      save(); render(); toast("Daten geladen.");
    }catch(err){toast("Datei passt nicht. Bitte eine Export-Datei wählen.");}};
  fr.readAsText(f); e.target.value="";
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Alle Länder, Notizen und Fotos löschen? Das lässt sich nicht rückgängig machen."))return;
  state={name:"",custom:[],d:{}}; save(); document.getElementById("nameIn").value=""; render(); toast("Alles gelöscht.");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openCode)closeSheet();});

/* ====== App-Installation ====== */
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
/* ====== Start ====== */
load();
try{localStorage.setItem(KEY+".t","1");localStorage.removeItem(KEY+".t");}catch(e){memOnly=true;}
document.getElementById("nameIn").value=state.name||"";
render();
</script>
</body>
